<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="1" stop-color="#f7b955"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="8" fill="url(#accent)"/>

  <text x="80" y="130" font-family="'DejaVu Sans Mono',monospace" font-size="60" font-weight="bold" fill="#e6edf3">redos<tspan fill="#ff6b6b">ray</tspan></text>
  <text x="80" y="188" font-family="'DejaVu Sans',sans-serif" font-size="34" fill="#8b949e">Find ReDoS-vulnerable regexes in your code — and</text>
  <text x="80" y="230" font-family="'DejaVu Sans',sans-serif" font-size="34" fill="#8b949e"><tspan fill="#f7b955" font-weight="bold">prove</tspan> each one, offline.</text>

  <rect x="80" y="280" width="1040" height="240" rx="14" fill="#010409" stroke="#30363d" stroke-width="2"/>
  <text x="110" y="330" font-family="'DejaVu Sans Mono',monospace" font-size="26" fill="#7ee787">$ npx redosray src/</text>
  <text x="110" y="380" font-family="'DejaVu Sans Mono',monospace" font-size="26" fill="#ff7b72" font-weight="bold">#1  EXPONENTIAL  (nested-quantifier)</text>
  <text x="110" y="420" font-family="'DejaVu Sans Mono',monospace" font-size="24" fill="#e6edf3">  /^([a-zA-Z0-9]+)+@example\.com$/</text>
  <text x="110" y="458" font-family="'DejaVu Sans Mono',monospace" font-size="22" fill="#8b949e">  proof "aaaa…aaa!" — 43 chars hung past 1000ms</text>
  <text x="110" y="496" font-family="'DejaVu Sans Mono',monospace" font-size="22" fill="#f7b955">  curve  ▁▁██  11 → 43 chars</text>

  <text x="80" y="575" font-family="'DejaVu Sans',sans-serif" font-size="24" fill="#8b949e">Static candidates, dynamically confirmed. No false positives.</text>
  <text x="1120" y="575" text-anchor="end" font-family="'DejaVu Sans',sans-serif" font-size="22" fill="#6e7681">MIT · maintained by an AI agent</text>
</svg>
